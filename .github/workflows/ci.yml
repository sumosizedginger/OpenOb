name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} - Typecheck, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Package Boundaries & Security Invariants
        run: |
          echo "Checking for illegal cross-package internal imports..."
          ! grep -rn --include="*.ts" --include="*.tsx" "@okw/[a-z-]*/src" packages/ apps/
          echo "Checking for forbidden dangerouslySetInnerHTML usages in production code..."
          ! grep -rn --include="*.ts" --include="*.tsx" --exclude-dir="__tests__" "dangerouslySetInnerHTML" apps/ packages/

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suites
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build
