name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} - Typecheck, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Package Boundaries & Security Invariants
        run: |
          echo "Checking for illegal cross-package internal imports..."
          ! grep -rn --include="*.ts" --include="*.tsx" "@okw/[a-z-]*/src" packages/ apps/
          echo "Checking for forbidden dangerouslySetInnerHTML usages in production code..."
          ! grep -rn --include="*.ts" --include="*.tsx" --exclude-dir="__tests__" "dangerouslySetInnerHTML" apps/ packages/
          echo "Scanning for accidental hardcoded secret keys..."
          ! grep -rnE --include="*.ts" --include="*.tsx" --exclude-dir="__tests__" --exclude-dir="tests" "(BEGIN PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,})" packages/ apps/

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Production Artifacts (Gateway, Web & Desktop)
        run: npm run build

      - name: Verify Executable Packaging & Binary Invocation
        run: |
          node apps/gateway/dist/bin/cli.js --help
          node apps/gateway/dist/bin/mcp.js --help

      - name: Run Test Suites
        run: npm test

  windows-gateway-runtime:
    name: Windows Node 24 Gateway Runtime Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Gateway Artifacts
        run: npm run build:gateway

      - name: Run Windows Gateway Process & Mutation Integration Tests
        run: npx vitest run apps/gateway/src/__tests__/gateway.test.ts tests/integrity/gateway-external-mutations.test.ts tests/integrity/gateway-process-packaging.test.ts

  e2e:
    name: Playwright E2E Browser Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Browser E2E Tests
        run: npm run test:e2e -- --ignore-snapshots

  desktop-electron:
    name: Electron Desktop Packaging & Windows E2E Smoke Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Desktop Release Packaging & Artifact Integrity
        run: npm run verify:desktop:release

      - name: Run Electron Desktop E2E Tests
        run: npm run test:e2e:electron

      - name: Upload Desktop Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openob-desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/release-manifest.json
          retention-days: 14
