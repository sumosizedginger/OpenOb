name: Feature Request
description: Suggest a new feature or enhancement for OpenOb
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        OpenOb follows a minimal core architecture. Please consider whether the proposed feature belongs in core or as a plugin.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: 'I am always frustrated when...'
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: dropdown
    id: scope_type
    attributes:
      label: Architectural Scope
      description: Should this be implemented in core or as a plugin?
      options:
        - Core Application (Storage, Index, Gateway, Editor, Native Shell)
        - Plugin / Extension (Daily Notes, Templates, Custom UI)
        - Tool / Developer CLI / MCP
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or workarounds have you considered?
